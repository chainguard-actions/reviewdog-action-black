name: Test verbose mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean Python file for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/verbose_python"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/verbose_python/clean.py" << 'EOF'
          x = 1
          y = 2
          print(x + y)
          EOF

      - name: Run action with verbose mode enabled
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/verbose_python
          verbose: "true"
          reporter: github-check
          filter_mode: nofilter
          fail_level: none

      - name: Assert action completed successfully with verbose mode
        run: |
          echo "Action completed with verbose=true without error"
          echo "PASS"
