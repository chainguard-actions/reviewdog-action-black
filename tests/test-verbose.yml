name: Test verbose mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a well-formatted Python file
      - name: Create well-formatted Python file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/verbose"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/verbose/good.py" << 'EOF'
          x = 1
          print(x)
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/verbose
          reporter: github-check
          filter_mode: nofilter
          fail_on_error: "false"
          verbose: "true"

      - name: Assert action completed successfully with verbose mode
        run: |
          echo "Action completed in verbose mode without error"
          echo "PASS"
