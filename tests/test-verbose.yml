name: Test verbose mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a clean Python file that black would not reformat
      - name: Create clean Python file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-verbose-python"
          cat > "$GITHUB_WORKSPACE/test-verbose-python/clean.py" << 'EOF'
          x = 1
          y = 2
          print(x + y)
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: test-verbose-python
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          verbose: "true"

      - name: Assert action ran with verbose mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with verbose mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
