name: Test basic usage with clean Python code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a well-formatted Python file in workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-clean"
          printf 'x = 1\ny = 2\nprint(x + y)\n' > "$GITHUB_WORKSPACE/test-clean/clean.py"

      - id: action
        uses: .
        with:
          workdir: test-clean
          github_token: fake-token-for-local-reporter
          reporter: github-check
          fail_on_error: "false"
          verbose: "true"

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error - black found no formatting issues"
          echo "PASS"
