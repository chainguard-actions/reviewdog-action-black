name: Test basic usage - well-formatted code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a well-formatted Python file for black to check
      - name: Create well-formatted Python file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/basic"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/basic/good.py" << 'EOF'
          x = 1
          y = 2
          z = x + y
          print(z)
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/basic
          reporter: github-check
          filter_mode: nofilter
          fail_on_error: "false"

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
