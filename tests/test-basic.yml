name: Test basic usage - well-formatted Python
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action on well-formatted Python code
        id: action
        uses: .
        with:
          # testdata/hello.py is already well-formatted
          workdir: pristine/reviewdog--action-black/v3.23.0/testdata
          github_token: fake-token-for-local-test
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          fail_on_error: "false"
          verbose: "true"
        continue-on-error: true

      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran to completion"
