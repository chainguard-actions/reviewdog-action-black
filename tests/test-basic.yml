name: Test basic usage - well-formatted code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a well-formatted Python file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-python"
          cat > "$GITHUB_WORKSPACE/test-python/hello.py" << 'EOF'
          print("hello world")
          EOF

      - name: Run action on well-formatted code
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: test-python
          reporter: github-check
          filter_mode: nofilter
          fail_on_error: "false"

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
