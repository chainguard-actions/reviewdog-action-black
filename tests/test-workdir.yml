name: Test workdir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Python file in a subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pristine/reviewdog--action-black/v3.23.0/testdata/subfolder"
          cat > "$GITHUB_WORKSPACE/pristine/reviewdog--action-black/v3.23.0/testdata/subfolder/sample.py" << 'EOF'
          x = 1
          print(x)
          EOF

      - name: Run action targeting a specific workdir
        id: action
        uses: .
        with:
          workdir: pristine/reviewdog--action-black/v3.23.0/testdata/subfolder
          github_token: fake-token-for-local-test
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          fail_on_error: "false"
          verbose: "true"
        continue-on-error: true

      - name: Assert action ran with custom workdir
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom workdir"
