name: Test custom tool name and level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create well-formatted Python file
        run: |
          mkdir -p tests/fixtures/custom-tool
          cat > tests/fixtures/custom-tool/main.py << 'EOF'
          def greet(name):
              return f"Hello, {name}!"


          print(greet("world"))
          EOF

      - name: Run action with custom tool name and warning level
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/custom-tool
          reporter: github-check
          filter_mode: nofilter
          tool_name: "my-black-formatter"
          level: "warning"
          fail_on_error: "false"

      - name: Assert action completed successfully with custom settings
        run: |
          echo "Action completed with custom tool_name and level=warning"
          echo "PASS"
