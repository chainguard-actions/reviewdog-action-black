name: Test custom tool_name and level inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a well-formatted Python file
      - name: Create well-formatted Python file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/custom-tool"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-tool/main.py" << 'EOF'
          def add(a, b):
              return a + b


          result = add(1, 2)
          print(result)
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/custom-tool
          tool_name: my-black-formatter
          level: warning
          reporter: github-check
          filter_mode: nofilter
          fail_on_error: "false"

      - name: Assert action completed with custom tool_name and level
        run: |
          echo "Action completed with custom tool_name and level without error"
          echo "PASS"
