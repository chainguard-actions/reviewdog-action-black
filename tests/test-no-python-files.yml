name: Test no Python files present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create directory with no Python files
        run: |
          mkdir -p tests/fixtures/no-python
          echo "# This is a markdown file" > tests/fixtures/no-python/README.md
          echo "key: value" > tests/fixtures/no-python/config.yaml

      - name: Run action on directory with no Python files
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/no-python
          reporter: github-check
          filter_mode: nofilter
          fail_on_error: "false"

      - name: Assert action completed without error when no Python files present
        run: |
          echo "Action completed without error when no Python files are present"
          echo "PASS"
