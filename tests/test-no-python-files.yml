name: Test no Python files present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory with no Python files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-empty"
          echo "# just a readme" > "$GITHUB_WORKSPACE/test-empty/README.md"

      - name: Run action on directory with no Python files
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: test-empty
          reporter: github-check
          filter_mode: nofilter
          fail_on_error: "false"

      - name: Assert action completed without error for empty directory
        run: |
          echo "Action completed without error when no Python files present"
          echo "PASS"
