name: Test no Python files scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory with no Python files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/no_python"
          echo "This is a text file, not Python" > "$GITHUB_WORKSPACE/tests/fixtures/no_python/readme.txt"

      - name: Run action on directory with no Python files
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/no_python
          reporter: github-check
          filter_mode: nofilter
          fail_level: none

      - name: Assert action completed without error even with no Python files
        run: |
          echo "Action completed without error when no Python files present"
          echo "PASS"
