name: Test black_args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean Python file for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/blackargs_python"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/blackargs_python/code.py" << 'EOF'
          def long_function_name(argument_one, argument_two, argument_three):
              return argument_one + argument_two + argument_three
          EOF

      - name: Run action with additional black args (line-length)
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/blackargs_python
          black_args: "--line-length 120"
          reporter: github-check
          filter_mode: nofilter
          fail_level: none

      - name: Assert action completed successfully with custom black args
        run: |
          echo "Action completed with black_args='--line-length 120' without error"
          echo "PASS"
