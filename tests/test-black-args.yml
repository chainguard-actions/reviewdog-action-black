name: Test black_args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with additional black arguments
        id: action
        uses: .
        with:
          workdir: pristine/reviewdog--action-black/v3.23.0/testdata
          black_args: "--line-length 88"
          github_token: fake-token-for-local-test
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          fail_on_error: "false"
          verbose: "true"
        continue-on-error: true

      - name: Assert action ran with black_args
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom black_args"
