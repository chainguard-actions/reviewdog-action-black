name: Test nofilter filter mode with github-check reporter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean Python file for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/nofilter_python"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/nofilter_python/sample.py" << 'EOF'
          def add(a, b):
              return a + b


          result = add(1, 2)
          print(result)
          EOF

      - name: Run action with nofilter mode
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/nofilter_python
          reporter: github-check
          filter_mode: nofilter
          level: warning
          fail_level: none

      - name: Assert action completed successfully
        run: |
          echo "Action completed with nofilter mode without error"
          echo "PASS"
